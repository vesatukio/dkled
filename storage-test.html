<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatatKu Storage Test</title>

<style>
body{
  font-family:Arial,sans-serif;
  padding:20px;
  font-size:18px;
  line-height:1.6;
}
.ok{
  color:green;
  font-weight:bold;
}
.fail{
  color:red;
  font-weight:bold;
}
.box{
  padding:15px;
  margin:15px 0;
  border:1px solid #ccc;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>CATATKU STORAGE TEST</h2>

<div id="hasil">Sedang mengetes...</div>

<script>

const hasil =
document.getElementById("hasil");

let html = "";


// =====================================================
// LOCAL STORAGE
// =====================================================

try {

  localStorage.setItem(
    "catatku_test",
    "OK"
  );

  const nilai =
    localStorage.getItem(
      "catatku_test"
    );

  if (nilai === "OK") {

    html += `
      <div class="box ok">
        ✅ LOCALSTORAGE BERHASIL
      </div>
    `;

  }
  else {

    html += `
      <div class="box fail">
        ❌ LOCALSTORAGE GAGAL
      </div>
    `;

  }

}
catch(error) {

  html += `
    <div class="box fail">
      ❌ LOCALSTORAGE GAGAL

      <br>

      Nama:
      ${error.name}

      <br>

      Pesan:
      ${error.message}
    </div>
  `;

}


// =====================================================
// INDEXED DB
// =====================================================

try {

  if (!window.indexedDB) {

    throw new Error(
      "IndexedDB tidak tersedia"
    );

  }

  const request =
    indexedDB.open(
      "CatatKuTest",
      1
    );


  request.onupgradeneeded =
    function(event) {

      const database =
        event.target.result;

      if (
        !database.objectStoreNames
          .contains("test")
      ) {

        database.createObjectStore(
          "test",
          {
            keyPath: "id"
          }
        );

      }

    };


  request.onsuccess =
    function(event) {

      const database =
        event.target.result;

      html += `
        <div class="box ok">
          ✅ INDEXEDDB BERHASIL

          <br>

          Nama:
          ${database.name}

          <br>

          Version:
          ${database.version}
        </div>
      `;

      database.close();

      hasil.innerHTML =
        html;

    };


  request.onerror =
    function(event) {

      const error =
        event.target.error;

      html += `
        <div class="box fail">
          ❌ INDEXEDDB GAGAL

          <br>

          Nama:
          ${error?.name || "Unknown"}

          <br>

          Pesan:
          ${error?.message || "Tidak ada pesan"}

          <br>

          Code:
          ${error?.code ?? "0"}
        </div>
      `;

      hasil.innerHTML =
        html;

    };


}
catch(error) {

  html += `
    <div class="box fail">
      ❌ INDEXEDDB GAGAL

      <br>

      Nama:
      ${error.name}

      <br>

      Pesan:
      ${error.message}
    </div>
  `;

  hasil.innerHTML =
    html;

}

</script>

</body>
</html>
