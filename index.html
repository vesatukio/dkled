<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duta Terang - Katalog</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f9f9f9; }
        
        /* Slider Container */
        .slider { width: 100%; height: 200px; background: #ddd; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* Kotak Pencarian di Tengah Slider */
        .search-box { position: absolute; width: 85%; padding: 15px; border-radius: 25px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Grid Produk */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        
        .btn-buy { background: #ff6600; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="slider">
        <input type="text" class="search-box" placeholder="Cari komponen LED / Audio...">
    </div>

    <div class="grid" id="product-list">
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Produk">
            <p style="margin: 5px 0; font-size: 0.9rem;">LED Driver 30W</p>
            <p style="font-weight: bold; color: #333;">Rp 25.000</p>
            <button class="btn-buy" onclick="addToCart()">Beli Sekarang</button>
        </div>
    </div>

    <script>
        // Logika sederhana untuk pencarian nanti akan disambungkan ke Firebase
        document.querySelector('.search-box').addEventListener('input', (e) => {
            console.log("Mencari: " + e.target.value);
            // Kode filter produk di sini
        });
    </script>
</body>
</html>
